# Blueprint do Render para o Ponto Digital CRM (pasta Ponto-Digital-CRM).
# O sistema antigo (Flask, na raiz do repositório) não é publicado nem alterado por este arquivo.
# Passo a passo: Ponto-Digital-CRM/docs/PUBLICACAO.md
#
# Segredos NÃO ficam aqui: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY e APP_URL são pedidos
# pelo Render na criação (sync: false) — gere os valores com `npm run publicacao:env`.
services:
  - type: web
    name: ponto-digital-crm
    runtime: node
    # Gratuito (512 MB) para a fase de testes: dorme após 15 min sem acesso e acorda no próximo acesso.
    # Para atender clientes de verdade (webhooks da Meta a qualquer hora), troque por 0.5c-512mb (Starter, US$ 7/mês).
    plan: free
    region: virginia # região dos EUA mais próxima do Brasil
    branch: claude/project-thread-iwgiqh # fase de testes; volte para main quando o teste integrado for aprovado
    rootDir: Ponto-Digital-CRM
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATA_BACKEND
        value: supabase
      - key: CRM_PUBLICADO
        value: "true"
      - key: WHATSAPP_SEND_MODE
        value: simulacao
      - key: WHATSAPP_CAMPAIGNS_LIVE
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # WhatsApp Web experimental (docs/WHATSAPP_WEB_EXPERIMENTAL.md): só chips e contatos de teste.
      - key: WAWEB_HABILITADO
        value: "true"
      - key: WAWEB_SESSION_KEY
        generateValue: true # 32 bytes aleatórios em base64, gerados pelo Render
      - key: WAWEB_NUMEROS_PERMITIDOS
        sync: false
      - key: WAWEB_CONTATOS_TESTE
        sync: false
