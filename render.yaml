# Blueprint do Render para o Ponto Digital CRM (pasta Ponto-Digital-CRM).
# O sistema antigo (Flask, na raiz do repositório) não é publicado nem alterado por este arquivo.
# Passo a passo: Ponto-Digital-CRM/docs/PUBLICACAO.md
#
# Segredos NÃO ficam aqui: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY e APP_URL são pedidos
# pelo Render na criação (sync: false) — gere os valores com `npm run publicacao:env`.
services:
  - type: web
    name: ponto-digital-crm
    runtime: node
    plan: 0.5c-512mb # Starter (0,5 CPU, 512 MB), US$ 7/mês: sempre ligado (necessário para os webhooks do WhatsApp)
    region: virginia # região dos EUA mais próxima do Brasil
    branch: main
    rootDir: Ponto-Digital-CRM
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeployTrigger: off # publica só de madrugada pela rotina do GitHub (.github/workflows/publicar-crm-madrugada.yml)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATA_BACKEND
        value: supabase
      - key: CRM_PUBLICADO
        value: "true"
      - key: WHATSAPP_SEND_MODE
        value: simulacao
      - key: WHATSAPP_CAMPAIGNS_LIVE
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        sync: false
