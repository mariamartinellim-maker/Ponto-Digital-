{% extends 'base.html' %}{% block content %}<section class="panel auth"><a href="{{url_for('index')}}">← Voltar</a><h1>Editar lançamento</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Tipo<select name="kind"><option value="entrada" {% if r.kind=='entrada' %}selected{% endif %}>Entrada</option><option value="saida" {% if r.kind=='saida' %}selected{% endif %}>Saída</option></select></label><label>Cliente ou fornecedor<input name="customer" value="{{r.customer}}" required></label><label>Produto ou serviço<input name="product" value="{{r.product}}" required></label><label>Valor (R$)<input name="amount" value="{{'%.2f'|format(r.amount_cents/100)|replace('.',',')}}" required></label><label>Data<input type="date" name="occurred_on" value="{{r.occurred_on}}" required></label><label>Observações<textarea name="notes">{{r.notes}}</textarea></label><button class="primary wide">Salvar alterações</button></form></section>{% endblock %}
