<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ponto Digital | Gestão</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="top"><a class="brand" href="{{url_for('index')}}"><span class="mark">P</span><span>Ponto Digital <small>GESTÃO</small></span></a>{% if session.get('uid') %}<div class="account"><span>{{session.email}}</span><form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="textbtn">Sair</button></form></div>{% endif %}</header><main class="container">{% for category,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
