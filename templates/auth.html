{% extends 'base.html' %}{% block content %}<section class="auth panel"><div class="eyebrow">PONTO DIGITAL</div><h1>{{'Entrar na sua conta' if mode=='login' else 'Criar minha conta'}}</h1><p>Suas vendas e finanças em um só lugar.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="voce@empresa.com"></label><label>Senha<input type="password" name="password" required minlength="{{8 if mode=='register' else 1}}" autocomplete="{{'new-password' if mode=='register' else 'current-password'}}" placeholder="Sua senha"></label><button class="primary wide">{{'Entrar' if mode=='login' else 'Criar conta'}}</button></form><p class="switch">{% if mode=='login' %}Não tem conta? <a href="{{url_for('register')}}">Cadastre-se</a>{% else %}Já tem conta? <a href="{{url_for('login')}}">Entrar</a>{% endif %}</p></section>{% endblock %}
